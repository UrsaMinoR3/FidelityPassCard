<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#edb1f1">
<title>Registro Salidas</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
</head>
<body>
  <div class="page">

    <!-- ===== AUTH ===== -->
    <section class="card" id="view-auth" hidden>
      <div class="card-top">
        <div class="brand"><span class="brand-mark">💗</span><span class="brand-name">Registro Salidas</span></div>
      </div>
      <div class="auth-body">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" type="button">Entrar</button>
          <button class="auth-tab" id="tabSignup" type="button">Crear cuenta</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label>Usuario o correo</label>
          <input type="text" id="loginIdentifier" required autocomplete="username">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
          <button type="submit" class="log-btn">Entrar</button>
        </form>

        <form id="signupForm" class="auth-form" hidden>
          <div class="form-row">
            <div><label>Nombre</label><input type="text" id="suName" required></div>
            <div><label>Apellido</label><input type="text" id="suLastName" required></div>
          </div>
          <label>Usuario</label>
          <input type="text" id="suUsername" required pattern="[a-zA-Z0-9_.]+" autocomplete="username">
          <label>Correo</label>
          <input type="email" id="suEmail" required autocomplete="email">
          <label>Contraseña</label>
          <input type="password" id="suPassword" required minlength="6" autocomplete="new-password">
          <button type="submit" class="log-btn">Crear cuenta</button>
        </form>

        <p class="auth-note" id="joinNote" hidden>Al entrar te unirás automáticamente al grupo de la invitación 💌</p>
        <div id="authStatus" class="status-msg"></div>
      </div>
    </section>

    <!-- ===== GROUPS LIST ===== -->
    <section class="card" id="view-groups" hidden>
      <div class="card-top">
        <div class="brand"><span class="brand-mark">💗</span><span class="brand-name">Registro Salidas</span></div>
      </div>

      <div class="profile-hub">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-info">
          <span class="profile-name" id="profileName">—</span>
          <span class="profile-username" id="profileUsername">—</span>
        </div>
        <button class="logout-btn" id="logoutBtn">Salir</button>
      </div>

      <div class="groups-body">
        <div class="section-lbl">Tus grupos</div>
        <div id="groupsList" class="groups-list"></div>

        <div class="section-lbl">Crear un grupo nuevo</div>
        <form id="createGroupForm" class="auth-form">
          <label>Nombre del grupo</label>
          <input type="text" id="newGroupName" placeholder="Ej: Yo y Lorena" required>
          <button type="submit" class="log-btn">+ Crear grupo</button>
        </form>
        <div id="groupsStatus" class="status-msg"></div>
      </div>
    </section>

    <!-- ===== GROUP / STAMP CARD ===== -->
    <section class="card" id="view-group" hidden>
      <div class="card-top">
        <button class="icon-btn" id="backBtn" title="Volver">←</button>
        <div class="cliente">
          <span class="cliente-lbl">GRUPO</span>
          <span class="cliente-name" id="groupName">—</span>
        </div>
      </div>

      <div class="banner" id="banner">
        <div class="stamp-grid" id="stampGrid"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-lbl">SALIDAS TOTALES</span>
          <span class="stat-val" id="totalVal">0</span>
        </div>
        <div class="stat stat-right">
          <span class="stat-lbl">COMPLETADAS</span>
          <span class="stat-val" id="completedVal">0</span>
        </div>
      </div>

      <div class="progress-note" id="progressNote">0 / 10 para la próxima tarjeta</div>

      <button class="log-btn" id="logBtn">+ Registrar salida</button>

      <div class="card-foot">
        <button class="ghost-btn" id="iconBtn">Cambiar ícono</button>
        <button class="ghost-btn" id="inviteBtn">Copiar invitación</button>
      </div>

      <div class="members-row" id="membersRow"></div>
    </section>

    <p class="hint">Registro Salidas · guardado en la nube, compartido con tu grupo</p>
  </div>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
